name: Build APK

on:
  push:
    branches: [ main, master, 'claude/**' ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # APK release (non-debuggable → fluido), firmato con la debug key = installabile.
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: spese-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Pubblica l'APK come Release: link diretto e permanente al file .apk.
      # Il tag "latest" viene aggiornato a ogni build, quindi punta sempre all'ultimo APK.
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Spese — APK (ultima build)
          body: |
            APK release ottimizzato (non-debuggable → fluido su dispositivi mid-range),
            firmato con la debug key quindi installabile direttamente.
            minSdk 26 / target 35 → compatibile con Android 14.
            Build automatica dal branch `${{ github.ref_name }}` — commit `${{ github.sha }}`.
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
