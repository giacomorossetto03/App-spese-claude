name: Build APK

on:
  push:
    branches: [ main, master, 'claude/**' ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: spese-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Pubblica l'APK come Release: link diretto e permanente al file .apk,
      # senza dover estrarre lo zip dell'artifact. Il tag "debug-latest" viene
      # aggiornato a ogni build, quindi punta sempre all'ultimo APK.
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Spese — APK debug (ultima build)
          body: |
            APK di debug installabile (minSdk 26, target 35 → compatibile con Android 14).
            Build automatica dal branch `${{ github.ref_name }}` — commit `${{ github.sha }}`.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
